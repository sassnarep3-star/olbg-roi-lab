[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olbg-roi-lab"
version = "0.1.0"
description = "Positive-ROI betting strategy research across OLBG sports, built on public data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OLBG ROI Lab contributors" }]
keywords = ["betting", "olbg", "sports", "roi", "elo", "value-betting", "backtesting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]

# The core runs on the Python standard library only.
# Optional heavier ML stack (install when doing real feature engineering):
[project.optional-dependencies]
ml = ["pandas>=2.0", "scikit-learn>=1.3", "lightgbm>=4.0", "requests>=2.31"]

[project.scripts]
olbg-roi = "olbg_roi.cli:main"

[tool.setuptools.packages.find]
include = ["olbg_roi*"]
